<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Deliverer</title>
  </head>
  <body>
    <main>
      <div class="container">
        <h1>Your Message goes here</h1>
        <input id="messInp" name="message" placeholder="Your message" />
        <button class="btn">Submit</button>
        <p>Last Message delivered</p>
        <textarea
          id="message"
          placeholder="Your Message"
          class="messages"
        ></textarea>
      </div>
    </main>
  </body>
  <script src="script.js"></script>
</html>
